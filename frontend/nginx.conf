server {
    listen 80;
    server_name _;
    # Las búsquedas administrativas pueden contener correos. No registrar peticiones.
    access_log off;
    error_log /dev/null;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 7m;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /salud {
        access_log off;
        default_type application/json;
        return 200 '{"estado":"disponible"}';
    }
    location /api/ {
        set $destino backend:3001;
        proxy_pass http://$destino;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        error_page 502 504 = @sin_backend;
        error_page 413 = @cuerpo_grande;
    }
    error_page 413 = @cuerpo_grande;
    location @cuerpo_grande {
        default_type application/json;
        return 413 '{"error":"El comprobante debe pesar menos de 5 MB."}';
    }
    location @sin_backend {
        default_type application/json;
        return 502 '{"error":"No se pudo conectar con el backend."}';
    }
    location /assets/ {try_files $uri =404;}
    location / {try_files $uri $uri/ /index.html;}
}
